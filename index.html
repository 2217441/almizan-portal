<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Al-Mizan internal portal</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  form { width: 100%; max-width: 22rem; display: grid; gap: 12px; }
  h1 { font-size: 1.25rem; margin: 0; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 6px; border: 1px solid #8888; }
  button { cursor: pointer; font-weight: 600; }
  p { margin: 0; min-height: 1.5em; }
</style>
</head>
<body>
<form id="login">
  <h1>Al-Mizan internal portal</h1>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" required autofocus>
  <button>Open</button>
  <p id="status" role="alert"></p>
</form>
<script src="/keys.js"></script>
<script>
  const BASE = '/';
  const say = (text) => { document.getElementById('status').textContent = text; };
  if (!('serviceWorker' in navigator) || !window.crypto?.subtle) {
    say('This browser cannot open the portal. Use a current browser, outside private browsing.');
  }
  document.getElementById('login').addEventListener('submit', async (event) => {
    event.preventDefault();
    say('Checking…');
    try {
      const { salt } = await (await fetch(`${BASE}gate.json`, { cache: 'no-store' })).json();
      const keys = await gate.deriveKeys(document.getElementById('password').value,
        Uint8Array.from(salt.match(/../g), (hex) => parseInt(hex, 16)));
      const check = await fetch(`${BASE}d/${await gate.nameFor(keys.mac, gate.CHECK)}`, { cache: 'no-store' });
      if (!check.ok) return say('Wrong password.');
      await gate.saveKeys(keys);
      const registration = await navigator.serviceWorker.register(`${BASE}sw.js`, { scope: BASE });
      // After a publish that changed sw.js the old worker is still in charge.
      // Wait for the new one, or the old one would serve files it cannot read.
      await registration.update().catch(() => {});
      const next = registration.installing ?? registration.waiting;
      if (next) {
        await new Promise((done) => next.addEventListener('statechange',
          () => ['activated', 'redundant'].includes(next.state) && done()));
      }
      await navigator.serviceWorker.ready;
      location.reload();
    } catch (error) {
      say(`Could not open the portal: ${error.message}`);
    }
  });
</script>
</body>
</html>
